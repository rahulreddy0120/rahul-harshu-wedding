name: Deploy to AWS

# Runs on every commit to main: applies Terraform, then builds and
# deploys the static site to S3 + invalidates CloudFront.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for GitHub OIDC → AWS role assumption
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VAR_aws_profile: "" # CI uses ambient OIDC creds, not a named profile

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    outputs:
      site_bucket: ${{ steps.tf_out.outputs.site_bucket }}
      cloudfront_id: ${{ steps.tf_out.outputs.cloudfront_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: infra
        env:
          TF_VAR_admin_password_hash: ${{ secrets.TF_VAR_ADMIN_PASSWORD_HASH }}
          TF_VAR_auth_secret: ${{ secrets.TF_VAR_AUTH_SECRET }}
        run: terraform apply -input=false -auto-approve

      - name: Export Terraform outputs
        id: tf_out
        working-directory: infra
        run: |
          echo "site_bucket=$(terraform output -raw site_bucket)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

  deploy-site:
    name: Build & Deploy Site
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static assets (long cache)
        run: |
          aws s3 sync out/ "s3://${{ needs.terraform.outputs.site_bucket }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" --exclude "*.json"

      - name: Sync HTML & JSON (no cache)
        run: |
          aws s3 sync out/ "s3://${{ needs.terraform.outputs.site_bucket }}/" \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" --include "*.html" --include "*.json"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ needs.terraform.outputs.cloudfront_id }}" \
            --paths "/*"
