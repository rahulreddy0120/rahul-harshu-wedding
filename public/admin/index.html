<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Host Portal · Harshini &amp; Rahul</title>
<style>
  :root {
    --bg: #0A0A0A; --gold: #C9A84C; --cream: #E8D5A3; --panel: #121212;
    --line: rgba(201,168,76,0.18); --soft: rgba(201,168,76,0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--cream);
    font-family: Georgia, 'Times New Roman', serif; min-height: 100vh;
  }
  a { color: var(--gold); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }
  header.site { text-align: center; padding: 40px 20px 10px; border-bottom: 1px solid var(--line); }
  header.site .detail { color: var(--gold); font-size: .72rem; letter-spacing: .28em; text-transform: uppercase; }
  header.site h1 { color: var(--gold); font-weight: normal; letter-spacing: .12em; font-size: 2rem; margin: 8px 0 4px; }
  header.site p { color: var(--gold); font-style: italic; margin: 0; opacity: .8; }

  /* Login */
  .login { max-width: 380px; margin: 12vh auto 0; background: var(--panel); border: 1px solid var(--line); padding: 40px 32px; text-align: center; }
  .login h2 { color: var(--gold); font-weight: normal; letter-spacing: .1em; margin: 0 0 6px; }
  .login p.sub { color: var(--cream); opacity: .7; font-size: .9rem; margin: 0 0 26px; }
  input[type=password] {
    width: 100%; padding: 13px 14px; background: #000; border: 1px solid var(--line);
    color: var(--cream); font-size: 1rem; font-family: inherit; letter-spacing: .05em; outline: none;
  }
  input[type=password]:focus { border-color: var(--gold); }
  button {
    width: 100%; margin-top: 16px; padding: 13px; background: var(--gold); color: #0A0A0A;
    border: none; font-family: inherit; font-size: .82rem; letter-spacing: .18em; text-transform: uppercase;
    cursor: pointer; transition: opacity .2s;
  }
  button:hover { opacity: .88; }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: #E88; font-size: .85rem; margin-top: 14px; min-height: 18px; }

  /* Dashboard */
  .hidden { display: none; }
  .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin: 26px 0; }
  .topbar h2 { color: var(--gold); font-weight: normal; letter-spacing: .08em; margin: 0; }
  .actions { display: flex; gap: 10px; }
  .actions button { width: auto; margin: 0; padding: 9px 16px; }
  .btn-ghost { background: transparent; color: var(--gold); border: 1px solid var(--line); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 14px; margin-bottom: 30px; }
  .stat { background: var(--panel); border: 1px solid var(--line); padding: 18px; text-align: center; }
  .stat .num { color: var(--gold); font-size: 2rem; }
  .stat .lbl { color: var(--cream); opacity: .7; font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); font-size: .9rem; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--gold); font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; font-weight: normal; background: var(--soft); }
  td { color: var(--cream); }
  td small { color: var(--gold); opacity: .75; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border: 1px solid var(--line); color: var(--gold); border-radius: 2px; }
  .tablewrap { overflow-x: auto; }
  .empty { text-align: center; padding: 40px; opacity: .6; }
  footer { text-align: center; margin-top: 40px; color: rgba(201,168,76,0.4); font-size: .78rem; }

  /* Selection + delete */
  .actions { flex-wrap: wrap; }
  .btn-danger { background: transparent; color: #E88; border: 1px solid rgba(232,136,136,.55); }
  .btn-danger:not(:disabled):hover { background: rgba(232,136,136,.12); opacity: 1; }
  .col-check { width: 36px; text-align: center; }
  .col-act { width: 80px; text-align: right; }
  td.col-check, td.col-act { vertical-align: middle; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--gold); cursor: pointer; }
  .row-del {
    width: auto; margin: 0; padding: 6px 10px; font-size: .64rem; letter-spacing: .12em;
    background: transparent; color: #E88; border: 1px solid rgba(232,136,136,.45);
  }
  .row-del:hover { background: rgba(232,136,136,.12); opacity: 1; }
  tr.selected td { background: rgba(201,168,76,0.09); }
  .chip.dup { color: #E8A06A; border-color: rgba(232,160,106,.6); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--gold); color: var(--cream); padding: 10px 18px; font-size: .85rem; z-index: 10; }
</style>
</head>
<body>
<header class="site">
  <div class="detail">శుభమస్తు · Host Portal</div>
  <h1>Harshini ♾ Rahul</h1>
  <p>November 12–15, 2026 · Texas</p>
</header>

<!-- LOGIN VIEW -->
<div id="loginView" class="login">
  <h2>Host Login</h2>
  <p class="sub">Enter the host password to view RSVPs</p>
  <form id="loginForm">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" autofocus />
    <button id="loginBtn" type="submit">Enter</button>
  </form>
  <div class="err" id="loginErr"></div>
</div>

<!-- DASHBOARD VIEW -->
<div id="dashView" class="wrap hidden">
  <div class="topbar">
    <h2>RSVP Dashboard</h2>
    <div class="actions">
      <button class="btn-ghost" id="refreshBtn" type="button">Refresh</button>
      <button class="btn-ghost" id="dupBtn" type="button" title="Select every duplicate (same email or name) except the newest one">Select duplicates</button>
      <button class="btn-danger" id="deleteSelBtn" type="button" disabled>Delete selected (0)</button>
      <button class="btn-ghost" id="csvBtn" type="button">Export CSV</button>
      <button id="logoutBtn" type="button">Log out</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tablewrap">
    <table id="rsvpTable">
      <thead>
        <tr>
          <th class="col-check"><input type="checkbox" id="selectAll" aria-label="Select all RSVPs" /></th>
          <th>Primary Guest</th>
          <th>Contact</th>
          <th>Party</th>
          <th>Events</th>
          <th>Dietary / Song / Message</th>
          <th>Submitted</th>
          <th class="col-act"><span class="sr-only">Actions</span></th>
        </tr>
      </thead>
      <tbody id="rsvpBody"></tbody>
    </table>
  </div>

  <footer>Two hearts. One forever. · Harshini &amp; Rahul · 2026</footer>
</div>

<script>
  const API = "/api";
  const TOKEN_KEY = "hr_admin_token";
  const EVENTS = ["sangeeth", "engagement", "mehendi", "haldi", "prewedding", "wedding"];
  const EVENT_LABEL = { sangeeth: "Sangeeth", engagement: "Engagement", mehendi: "Mehendi", haldi: "Haldi", prewedding: "Pre-Wedding", wedding: "Wedding" };
  const evLabel = (e) => EVENT_LABEL[e] || e;

  const $ = (id) => document.getElementById(id);
  const loginView = $("loginView"), dashView = $("dashView");

  function showDash() { loginView.classList.add("hidden"); dashView.classList.remove("hidden"); }
  function showLogin() { dashView.classList.add("hidden"); loginView.classList.remove("hidden"); }

  // --- Login ---
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("loginBtn"), err = $("loginErr");
    err.textContent = ""; btn.disabled = true; btn.textContent = "Checking…";
    try {
      const res = await fetch(API + "/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: $("password").value }),
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error || "Login failed"; return; }
      localStorage.setItem(TOKEN_KEY, data.token);
      $("password").value = "";
      await loadDashboard();
    } catch (_) {
      err.textContent = "Network error. Try again.";
    } finally {
      btn.disabled = false; btn.textContent = "Enter";
    }
  });

  $("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem(TOKEN_KEY);
    showLogin();
  });
  $("refreshBtn").addEventListener("click", loadDashboard);
  $("csvBtn").addEventListener("click", exportCsv);

  let currentData = null;

  async function loadDashboard() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) { showLogin(); return; }
    const res = await fetch(API + "/rsvps", { headers: { "Authorization": "Bearer " + token } });
    if (res.status === 401) { localStorage.removeItem(TOKEN_KEY); showLogin(); $("loginErr").textContent = "Session expired. Please log in again."; return; }
    const data = await res.json();
    currentData = data;
    renderStats(data);
    renderTable(data.rsvps || []);
    showDash();
  }

  function renderStats(d) {
    const be = d.by_event || {};
    const cards = [
      ["Parties", d.total_rsvps || 0],
      ["Total Guests", d.total_guests || 0],
      ["Sangeeth", be.sangeeth || 0],
      ["Engagement", be.engagement || 0],
      ["Mehendi", be.mehendi || 0],
      ["Haldi", be.haldi || 0],
      ["Pre-Wedding", be.prewedding || 0],
      ["Wedding", be.wedding || 0],
    ];
    $("stats").innerHTML = cards.map(([lbl, num]) =>
      `<div class="stat"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`
    ).join("");
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---- Selection + duplicates ----------------------------------------------
  // A row is identified by its DynamoDB primary key (rsvpId + submittedAt).
  const keyOf = (r) => `${r.rsvpId}|${r.submittedAt}`;
  const selected = new Set();
  let rowsByKey = new Map();
  let dupKeys = new Set();      // every row that shares an email with another row
  let olderDupKeys = new Set(); // duplicates except the newest one per email

  const normEmail = (s) => String(s || "").trim().toLowerCase();
  const normName = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9& ]+/g, " ").split(/\s+/).filter(Boolean).join(" ");

  // Rows sharing an email OR a name are one duplicate group (union-find, so
  // A~B by email and B~C by name puts A, B, C together).
  function computeDuplicates(sorted) {
    dupKeys = new Set(); olderDupKeys = new Set();
    const parent = sorted.map((_, i) => i);
    const find = (i) => (parent[i] === i ? i : (parent[i] = find(parent[i])));
    const firstBy = new Map();
    sorted.forEach((r, i) => {
      [["e", normEmail(r.email)], ["n", normName(r.primaryName)]].forEach(([kind, v]) => {
        if (!v) return;
        const k = kind + ":" + v;
        if (firstBy.has(k)) parent[find(i)] = find(firstBy.get(k)); else firstBy.set(k, i);
      });
    });
    const groups = new Map();
    sorted.forEach((r, i) => {
      const g = find(i);
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(r);                // sorted is newest first, so list[0] is newest
    });
    groups.forEach((list) => {
      if (list.length < 2) return;
      list.forEach((r, i) => { dupKeys.add(keyOf(r)); if (i > 0) olderDupKeys.add(keyOf(r)); });
    });
  }

  function syncSelectionUi() {
    const n = selected.size;
    const btn = $("deleteSelBtn");
    btn.disabled = n === 0;
    btn.textContent = `Delete selected (${n})`;
    document.querySelectorAll("#rsvpBody tr[data-key]").forEach((tr) => {
      const on = selected.has(tr.dataset.key);
      tr.classList.toggle("selected", on);
      const cb = tr.querySelector(".row-check");
      if (cb) cb.checked = on;
    });
    const all = $("selectAll"), total = rowsByKey.size;
    all.checked = total > 0 && n === total;
    all.indeterminate = n > 0 && n < total;
    $("dupBtn").disabled = olderDupKeys.size === 0;
    $("dupBtn").textContent = olderDupKeys.size ? `Select duplicates (${olderDupKeys.size})` : "No duplicates";
  }

  function renderTable(rsvps) {
    const body = $("rsvpBody");
    // newest first
    const sorted = [...rsvps].sort((a, b) => String(b.submittedAt).localeCompare(String(a.submittedAt)));
    rowsByKey = new Map(sorted.map((r) => [keyOf(r), r]));
    // drop selections for rows that no longer exist
    [...selected].forEach((k) => { if (!rowsByKey.has(k)) selected.delete(k); });
    computeDuplicates(sorted);
    if (!sorted.length) {
      body.innerHTML = `<tr><td colspan="8" class="empty">No RSVPs yet.</td></tr>`;
      syncSelectionUi();
      return;
    }
    body.innerHTML = sorted.map((r) => {
      const key = keyOf(r);
      const guests = (r.guests || []).map((g) => {
        const evs = EVENTS.filter((e) => g[e]).map((e) => `<span class="chip">${evLabel(e)}</span>`).join("");
        const kids = Number(g.kids || 0);
        const party = `${Number(g.adults || 0)} adult(s)` + (kids ? `, ${kids} kid(s)` : "");
        return `<div style="margin-bottom:6px;">◆ ${esc(party)}<div class="chips" style="margin-top:3px;">${evs}</div></div>`;
      }).join("");
      const extras = [
        r.dietary ? `<div><small>Dietary:</small> ${esc(r.dietary)}</div>` : "",
        r.songRequest ? `<div><small>Song:</small> ${esc(r.songRequest)}</div>` : "",
        r.message ? `<div><small>Message:</small> ${esc(r.message)}</div>` : "",
      ].join("") || `<span style="opacity:.4">—</span>`;
      const when = r.submittedAt ? new Date(r.submittedAt).toLocaleString() : "—";
      const dup = dupKeys.has(key) ? ` <span class="chip dup" title="Another RSVP has the same email or name">Duplicate</span>` : "";
      return `<tr data-key="${esc(key)}">
        <td class="col-check"><input type="checkbox" class="row-check" aria-label="Select RSVP from ${esc(r.primaryName)}" /></td>
        <td><strong style="color:var(--gold)">${esc(r.primaryName)}</strong>${dup}<div><small>${r.guestCount || 0} guest(s)</small></div></td>
        <td>${esc(r.email)}<div><small>${esc(r.phone || "")}</small></div></td>
        <td>${guests}</td>
        <td>${EVENTS.filter((e) => (r.events || {})[e]).map((e) => `<span class="chip">${evLabel(e)} ${(r.events||{})[e]}</span>`).join(" ")}</td>
        <td>${extras}</td>
        <td>${esc(when)}</td>
        <td class="col-act"><button type="button" class="row-del" aria-label="Delete RSVP from ${esc(r.primaryName)}">Delete</button></td>
      </tr>`;
    }).join("");
    syncSelectionUi();
  }

  // Row checkbox + per-row delete (event delegation)
  $("rsvpBody").addEventListener("change", (e) => {
    if (!e.target.classList.contains("row-check")) return;
    const key = e.target.closest("tr").dataset.key;
    if (e.target.checked) selected.add(key); else selected.delete(key);
    syncSelectionUi();
  });
  $("rsvpBody").addEventListener("click", (e) => {
    const btn = e.target.closest(".row-del");
    if (!btn) return;
    deleteRsvps([btn.closest("tr").dataset.key]);
  });
  $("selectAll").addEventListener("change", (e) => {
    selected.clear();
    if (e.target.checked) rowsByKey.forEach((_, k) => selected.add(k));
    syncSelectionUi();
  });
  $("dupBtn").addEventListener("click", () => {
    selected.clear();
    olderDupKeys.forEach((k) => selected.add(k));
    syncSelectionUi();
  });
  $("deleteSelBtn").addEventListener("click", () => deleteRsvps([...selected]));

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  async function deleteRsvps(keys) {
    const rows = keys.map((k) => rowsByKey.get(k)).filter(Boolean);
    if (!rows.length) return;
    const names = rows.slice(0, 8).map((r) => `• ${r.primaryName} <${r.email}>`).join("\n")
      + (rows.length > 8 ? `\n…and ${rows.length - 8} more` : "");
    if (!confirm(`Permanently delete ${rows.length} RSVP(s)?\n\n${names}\n\nThis cannot be undone.`)) return;

    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) { showLogin(); return; }
    let deleted = 0;
    try {
      for (let i = 0; i < rows.length; i += 100) {   // API accepts up to 100 per call
        const chunk = rows.slice(i, i + 100).map((r) => ({ rsvpId: r.rsvpId, submittedAt: r.submittedAt }));
        const res = await fetch(API + "/rsvps/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ items: chunk }),
        });
        if (res.status === 401) {
          localStorage.removeItem(TOKEN_KEY); showLogin();
          $("loginErr").textContent = "Session expired. Please log in again.";
          return;
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) throw new Error(data.error || `HTTP ${res.status}`);
        deleted += data.deleted || 0;
      }
      keys.forEach((k) => selected.delete(k));
      toast(`Deleted ${deleted} RSVP(s).`);
    } catch (err) {
      alert("Delete failed: " + err.message);
    }
    await loadDashboard();
  }

  function exportCsv() {
    if (!currentData || !currentData.rsvps) return;
    const rows = [["Primary Name", "Email", "Phone", "Total Guests", "Adults", "Kids", "Party Breakdown", "Sangeeth", "Engagement", "Mehendi", "Haldi", "Pre-Wedding", "Wedding", "Dietary", "Song Request", "Message", "Submitted At"]];
    currentData.rsvps.forEach((r) => {
      const ev = r.events || {};
      const gs = r.guests || [];
      const adults = gs.reduce((s, g) => s + Number(g.adults || 0), 0);
      const kids = gs.reduce((s, g) => s + Number(g.kids || 0), 0);
      const breakdown = gs.map((g) => `${Number(g.adults || 0)}A${Number(g.kids || 0) ? "+" + Number(g.kids) + "K" : ""}`).join("; ");
      rows.push([
        r.primaryName || "", r.email || "", r.phone || "", r.guestCount || (adults + kids),
        adults, kids, breakdown,
        ev.sangeeth || 0, ev.engagement || 0, ev.mehendi || 0, ev.haldi || 0, ev.prewedding || 0, ev.wedding || 0,
        r.dietary || "", r.songRequest || "", (r.message || "").replace(/\n/g, " "), r.submittedAt || "",
      ]);
    });
    const csv = rows.map((row) => row.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "wedding-rsvps-" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // Auto-login if token present
  if (localStorage.getItem(TOKEN_KEY)) { loadDashboard(); }
</script>
</body>
</html>
